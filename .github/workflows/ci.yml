name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run project tests on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash ci.sh

      - name: Run project tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
